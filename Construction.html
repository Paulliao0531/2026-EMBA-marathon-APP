<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>網頁施工中</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; color: #633719; background: linear-gradient(135deg, #fff8f0, #fdebd0); }
    .page-header { padding: 22px 20px 22px 76px; background: linear-gradient(135deg, #c55a11, #e8722a 60%, #f4a03a); box-shadow: 0 3px 12px #c55a1133; }
    .page-header p { margin: 0; color: white; font-size: 20px; font-weight: 800; letter-spacing: 1px; }
    .home-link { position: fixed; top: 12px; left: 12px; z-index: 10; display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: white; box-shadow: 0 2px 10px #0003; color: #c55a11; text-decoration: none; }
    .home-link svg { width: 26px; height: 26px; fill: currentColor; }
    a:focus-visible { outline: 3px solid #0076cc; outline-offset: 5px; }
    .home-link:hover { color: #0076cc; }
    main { max-width: 740px; margin: 0 auto; padding: 36px 18px 48px; text-align: center; }
    .card { padding: 24px 24px 36px; background: #fffdf9; border: 1px solid #f3dcc4; border-radius: 24px; box-shadow: 0 12px 40px #a65c1814; overflow: hidden; }
    .illustration { display: block; width: 100%; max-width: 490px; height: auto; margin: 0 auto 12px; }
    .badge { display: inline-block; padding: 6px 14px; border-radius: 30px; background: #fff0cc; color: #92500c; font-size: 12px; font-weight: 800; letter-spacing: 2px; }
    h1 { margin: 16px 0 12px; font-size: clamp(28px, 6vw, 38px); letter-spacing: 2px; }
    .description { margin: 0 0 26px; color: #89694f; line-height: 1.9; font-size: 16px; }
    .back-home { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 12px 28px; border-radius: 12px; background: #c55a11; color: white; font-weight: 700; text-decoration: none; }
    .back-home:hover { background: #a94b0b; }
    .back-home svg { width: 20px; height: 20px; fill: currentColor; }
    @media (max-width: 400px) { main { padding: 22px 12px 32px; } .card { padding: 18px 14px 28px; } }
  </style>
</head>
<body>
  <a class="home-link" href="index.html" aria-label="回到首頁" title="回到首頁">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 12h3v9h5v-6h4v6h5v-9h3L12 3z"/></svg>
  </a>
  <header class="page-header"><p>網頁施工中</p></header>
  <main>

        <defs>

        </defs>

          <path d="M229 157q11 13 23 0" fill="#fff"/>
          <path d="M209 155h7m49 0h7" stroke="#ed9b7d"/>
        </g>
        <g stroke="#8a633d" stroke-width="4" stroke-linejoin="round">
          <path d="M89 245v69m89-69v69" stroke-width="10"/>

          <rect x="340" y="303" width="73" height="13" rx="5" fill="#d96c24"/>
        </g>
        <g fill="#dbab75"><rect x="418" y="283" width="34" height="16" rx="3"/><rect x="426" y="301" width="34" height="16" rx="3"/></g>
      </svg>
      <span class="badge" lang="en">UNDER CONSTRUCTION</span>
      <h1 id="page-title">正在努力施工中</h1>
      <p class="description">這個頁面還在準備中，敬請期待！<br>先回首頁逛逛，更多精彩內容即將登場。</p>
      <a class="back-home" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 12h3v9h5v-6h4v6h5v-9h3L12 3z"/></svg>回到首頁</a>
    </section>
  </main>
</body>
</html>
