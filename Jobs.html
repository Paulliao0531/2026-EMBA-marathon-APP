<html lang="zh-TW">
<head>

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="全E馬">
  <meta name="theme-color" content="#0f1117">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=yes">
  <title>工作分配｜2026 全E馬</title>

<style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      display: block;
      margin: 0;
      padding: 0;
      background-color: #0f1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
      color: #d0d0d0;
    }

    /* 懸浮首頁按鈕 */
    .floating-home-link {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background-color: #1e2130;
      border-radius: 50%;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }
    .floating-home-link:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
    }
    .floating-home-link svg {
      width: 26px;
      height: 26px;
      fill: #e8651a;
      transition: fill 0.2s ease;
    }
    .floating-home-link:hover svg {
      fill: #4da6f5;
    }

    /* 主容器 */
    .page-container {
      max-width: 640px;
      margin: 0 auto;
      padding: 80px 16px 48px;
    }

    /* 頁面標題 */
    .page-title-wrap {
      text-align: center;
      margin-bottom: 20px;
    }
    .page-title {
      display: inline-block;
      font-size: 32px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #0076cc 30%, #e8651a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
    }
    .hotel-tip {
      font-size: 20px;
      color: #fff;
      text-align: center;
      margin: 8px 0 0;
    }

    /* 飯店區塊 */
    .hotel-section {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 36px;
    }

    /* 飯店卡片外框 */
    .hotel-card {
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      background: #1e2130;
    }

    /* 卡片頂部色彩橫幅 */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    }
    .card-header::before {
      content: '';
      position: absolute;
      top: -25px;
      right: -25px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #ffffff;
      opacity: 0.15;
    }
    .card-header::after {
      content: '';
      position: absolute;
      bottom: -35px;
      left: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #ffffff;
      opacity: 0.10;
    }
    .singapore-card .card-header {
      background: linear-gradient(135deg, #003f6e 0%, #005fa3 40%, #0076cc 70%, #1a8fe0 100%);
    }
    .thailand-card .card-header {
      background: linear-gradient(135deg, #6b2200 0%, #a33d0a 35%, #c04d10 65%, #e8651a 100%);
    }
    .card-header-icon {
      font-size: 28px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.3));
    }
    .card-header-label {
      font-size: 26px;
      font-weight: 800;
      font-style: italic;
      color: #ffffff;
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    /* 卡片主體 */
    .card-body {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px;
    }

    /* 圖片保持原始比例，使用原圖解析度顯示。 */
    .hotel-icon { display: block; background: transparent; }

    /* 飯店文字資訊 */
    .hotel-info {
      flex: 1;
      min-width: 0;
    }
    .hotel-name {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.3;
      margin: 0 0 8px 0;
      word-break: break-word;
    }
    .singapore-card .hotel-name {
      color: #4da6f5;
    }
    .thailand-card .hotel-name {
      color: #e8651a;
    }
    .hotel-details {
      font-size: 20px;
      line-height: 1.65;
      color: #ffe600;
      margin: 0;
    }

    /* 分隔線 */
    .section-divider {
      border: 0;
      height: 2px;
      background: linear-gradient(to right, transparent, #2e3450, transparent);
      margin: 8px 0 32px;
    }

    /* 名單區塊標題 */
    .roster-title {
      font-size: 18px;
      font-weight: 800;
      color: #d0d0d0;
      margin: 0 0 14px 0;
      padding-left: 4px;
      border-left: 5px solid #e8651a;
      padding-left: 12px;
    }

    /* 名單表格 */
    .roster-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .roster-cell {
      background: linear-gradient(135deg, #1e2130 0%, #252a3a 100%);
      border: 2px solid #b05a20;
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
      font-size: 20px;
      font-weight: 400;
      color: #e0e0e0;
      white-space: pre-line;
      line-height: 1.5;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(176, 90, 32, 0.2);
    }
    .roster-cell.empty-cell {
      background: transparent;
      border: 2px dashed #2e3450;
      box-shadow: none;
      color: transparent;
    }
      .tips-card { position: relative; isolation: isolate; overflow: hidden; padding: 26px 24px; border: 1px solid rgba(255, 224, 195, .38); border-radius: 24px; background: linear-gradient(135deg, rgba(255, 196, 138, .18) 0%, rgba(172, 77, 22, .22) 45%, rgba(218, 116, 40, .16) 100%); -webkit-backdrop-filter: blur(24px) saturate(150%); backdrop-filter: blur(24px) saturate(150%); color: #fff; box-shadow: 0 16px 40px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .3), inset 0 -1px 0 rgba(255, 211, 169, .1); }
    .tips-card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(145deg, rgba(255, 255, 255, .12), transparent 35%, transparent 75%, rgba(255, 218, 180, .06)); pointer-events: none; }
    .tips-card::after { content: ''; position: absolute; top: 0; left: 12%; right: 12%; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .65), transparent); pointer-events: none; }
    .tips { position: relative; z-index: 1; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .65); list-style-type: disc; margin: 0; padding-left: 1.2em; font-size: 21px; line-height: 1.8; }
    .tips li { padding-left: .2em; margin-bottom: 18px; overflow-wrap: anywhere; }
    .tips li:last-child { margin-bottom: 0; }
    .tips li::marker { color: #fff; }
    .card-body { flex-direction: column; gap: 22px; padding: 10px 10px 24px; }
    .address-link { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 6px 8px; color: #fff2a8; text-decoration: underline; text-decoration-color: #fff2a8; text-underline-offset: 5px; overflow-wrap: anywhere; }
    .address-link:hover { color: #fff2a8; }
    .hotel-icon { width: 100%; height: auto; object-fit: contain; }
    .hotel-info { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); align-items: center; width: 100%; padding: 0 10px; text-align: center; }
    .hotel-info .hotel-name { margin: 0; padding-right: 8px; }
    .hotel-info .hotel-details { min-width: 0; }
    .hotel-info .address-link { max-width: 100%; text-align: left; }
    .thailand-card .hotel-name { color: #ffd1a8; }
    .hotel-details { color: #fff; }
    .tips { list-style: none; padding-left: 0; }
    .tips li { position: relative; padding-left: 2em; }
    .tips li::before { content: "🍺"; position: absolute; left: 0; top: 0; font-size: 1.2em; line-height: 1.5; }
    a:focus-visible { outline: 3px solid #ffca28; outline-offset: 4px; }
    @media (max-width: 380px) { .tips { font-size: 20px; } .card-body { padding: 8px 8px 20px; } }
    .location-icon { display: inline-block; width: 1.3em; height: 1.3em; margin-right: .3em; vertical-align: -.3em; object-fit: contain; flex-shrink: 0; }
    .staff-hero { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; object-fit: cover; }
    .jobs-list { position: relative; margin: 0; }
    .job { padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,.18); }
    .job:first-child { padding-top: 0; }
    .job:last-child { padding-bottom: 0; border-bottom: 0; }
    .job dt { color: #ffd1a8; font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .job dd { margin: 0; color: #fff; font-size: 21px; line-height: 1.8; overflow-wrap: anywhere; }
    .job-note { display: block; font-size: 18px; color: #d0e9dd; }
  </style>
</head>
