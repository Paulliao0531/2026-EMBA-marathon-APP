<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>溫馨提醒｜2026 全E馬</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0f1117; color: #fff; font-family: Arial, "Microsoft JhengHei", sans-serif; }
    .home-link { position: fixed; top: 16px; left: 16px; z-index: 10; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: #1a1d27; box-shadow: 0 2px 12px #0006; transition: transform .2s; }
    .home-link:hover { transform: scale(1.1); }
    .home-link svg { width: 26px; height: 26px; fill: #e8a06a; }
    .page-container { max-width: 640px; margin: auto; padding: 80px 24px 48px; }
    .page-title { text-align: center; font-size: 36px; font-weight: 900; font-style: italic; letter-spacing: 1px; margin: 0 0 28px; background: linear-gradient(135deg, #5b9bd5, #8ec3f0, #5b9bd5); background-clip: text; -webkit-background-clip: text; color: transparent; }
    .tips-card { position: relative; overflow: hidden; padding: 26px 24px; border: 1px solid #348e68; border-radius: 18px; background: linear-gradient(135deg, #073b2a 0%, #0b5138 45%, #146344 100%); color: #fff; box-shadow: 0 6px 20px rgba(0, 0, 0, .28); }
    .tips-card::before { content: ''; position: absolute; top: -30px; right: -30px; width: 110px; height: 110px; border-radius: 50%; background: rgba(255, 255, 255, .08); pointer-events: none; }
    .tips-card::after { content: ''; position: absolute; bottom: -40px; left: 10px; width: 90px; height: 90px; border-radius: 50%; background: rgba(255, 255, 255, .04); pointer-events: none; }
    .tips { position: relative; z-index: 1; color: #fff; list-style-type: disc; margin: 0; padding-left: 1.2em; font-size: 21px; line-height: 1.8; }
    .tips li { padding-left: .2em; margin-bottom: 18px; overflow-wrap: anywhere; }
    .tips li:last-child { margin-bottom: 0; }
    .tips li::marker { color: #fff; }
    .title-icon { display: inline-block; margin-right: .25em; font-style: normal; color: #ffd76a; -webkit-text-fill-color: #ffd76a; }
    a:focus-visible { outline: 3px solid #ffca28; outline-offset: 4px; }
    @media (max-width: 380px) { .page-title { font-size: 30px; } .tips { font-size: 20px; } }
      /* 每項自動顯示跑鞋；新增事項仍只需加入 <li>內容</li>。 */
    .tips { list-style: none; padding-left: 0; }
    .tips li { position: relative; padding-left: 1.9em; }
    .tips li::before { content: "👟"; position: absolute; left: 0; top: 0; width: 1.5em; text-align: center; font-size: 1em; line-height: inherit; }
  </style>
</head>
<body>
  <a href="index.html" class="home-link" title="返回首頁" aria-label="返回首頁">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
  </a>
  <main class="page-container">
    <h1 class="page-title"><span class="title-icon" aria-hidden="true">💡</span>溫馨提醒</h1>
    <!-- 新增提示時，在下方清單內增加一行 <li>提示內容</li> 即可。 -->
    <div class="tips-card">
    <ul class="tips">
      <li>為響應環保，東華不提供瓶裝水，請大家自備環保杯到補水站取水。</li>
      <li>車輛進入學校第一小時免費，每日最高收費100元。</li>
      <li>跑完步可到游泳池沖洗，入場費40元/人。</li>
      <li>東華大學是平面學校，賽道沒有上下坡，只有景觀橋有小拱形，過橋略有上下坡。</li>
    </ul>
    </div>
  </main>
</body>
</html>
