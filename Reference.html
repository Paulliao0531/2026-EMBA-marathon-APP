<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>溫馨提示｜2026 全E馬</title><style>
*{box-sizing:border-box}body{margin:0;background:#0f1117;color:#fff;font-family:Arial,"Microsoft JhengHei",sans-serif}.home-link{position:fixed;top:16px;left:16px;z-index:10;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#1a1d27;box-shadow:0 2px 12px #0006;transition:transform .2s}.home-link:hover{transform:scale(1.1)}.home-link svg{width:26px;height:26px;fill:#e8a06a}.page-container{max-width:640px;margin:auto;padding:80px 16px 48px}.page-title{text-align:center;font-size:36px;font-weight:900;font-style:italic;letter-spacing:1px;margin:0 0 8px;background:linear-gradient(135deg,#5b9bd5,#8ec3f0,#5b9bd5);background-clip:text;-webkit-background-clip:text;color:transparent}.page-tip{text-align:center;color:#b4ccf0;line-height:1.6;margin:0 0 28px}.group{--accent:#72bcff;--start:#002d54;--end:#0069b4}.group-e{--accent:#ffbe75;--start:#5a1800;--end:#a74009}.group-g{--accent:#deb1ff;--start:#39145d;--end:#742da8}.section-title{font-size:24px;border-left:5px solid var(--accent);padding-left:12px;margin:30px 0 8px}.group-sub{color:var(--accent);margin:0 0 14px 17px;line-height:1.5}.team-list{display:grid;gap:14px}.team-card{border-radius:18px;padding:20px 22px;background:linear-gradient(135deg,var(--start),var(--end));box-shadow:0 6px 20px #0004;position:relative;overflow:hidden}.team-card:before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:#ffffff16;pointer-events:none}.team-card h3{position:relative;font-size:21px;margin:0 0 12px;color:#fff}.runners{position:relative;list-style:none;padding:0;margin:0;border-top:1px solid #ffffff30}.runners li{display:flex;gap:16px;align-items:baseline;padding:10px 0;border-bottom:1px solid #ffffff20;font-size:21px;line-height:1.5}.runners li:last-child{border-bottom:0;padding-bottom:0}.leg{flex:0 0 58px;color:#ffe398;font-size:16px;font-weight:700}.name{overflow-wrap:anywhere}.rules{margin-top:32px;border:1px solid #468cc3;border-radius:18px;overflow:hidden;background:#10243c}.rules summary{display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none;padding:20px 22px;cursor:pointer;background:linear-gradient(135deg,#00365f,#0069b4);font-size:21px;font-weight:700}.rules summary::-webkit-details-marker{display:none}.rules summary:after{content:"＋";font-size:26px}.rules[open] summary:after{content:"−"}.rules-body{padding:4px 18px 20px}.rule{border-left:4px solid var(--rule-color);padding:0 0 0 12px;margin-top:24px}.rule h3{color:var(--rule-color);font-size:19px;line-height:1.6;margin:0 0 8px}.rule ul{padding-left:22px;margin:0;line-height:1.9;font-size:17px}.notice{margin:24px 0 0;padding:16px;background:#6b3010;border:1px solid #f5ab64;border-radius:12px;line-height:1.8;color:#fff0ce}a:focus-visible,summary:focus-visible{outline:3px solid #ffca28;outline-offset:4px}@media(max-width:380px){.team-card{padding:18px}.runners li{font-size:20px;gap:10px}.page-title{font-size:30px}}
