    <div class="tips-card">
    <ul class="tips">
      <li><span class="important-label">重要！</span>為響應環保，東華不提供瓶裝水，請大家自備環保杯到補水站取水。</li>
      <li><span class="important-label">重要！</span>D 組參賽人員請務必攜帶學生證備查。</li>
      <li>車輛進入學校第一小時免費，每日最高收費100元。</li>
      <li>跑完步可到游泳池沖洗，入場費40元/人。</li>
      <li>東華大學是平面學校，賽道沒有上下坡，只有景觀橋有小拱形，過橋略有上下坡。</li>
