<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- 手機桌面圖示：iPhone / Android -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="全E馬">
  <meta name="theme-color" content="#0f1117">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=yes">
  <title>EMBA Restaurants</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      display: block;
      margin: 0;
      padding: 0;
      background-color: #0f1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* 懸浮首頁按鈕 */
    .home-link {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background-color: #1e2130;
      border-radius: 50%;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }
    .home-link:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
    }
    .home-link svg {
      width: 26px;
      height: 26px;
      fill: #e8651a;
      transition: fill 0.2s ease;
    }
    .home-link:hover svg {
      fill: #4da6f5;
    }

    /* 主容器 */
    .page-container {
      max-width: 640px;
      margin: 0 auto;
      padding: 80px 16px 40px;
    }

    /* 國家區塊 */
    .country-section {
      margin-bottom: 40px;
    }
    .country-section:last-child {
      margin-bottom: 0;
    }

    /* 國家標題橫幅 */
    .country-header {
      display: flex;
      align-items: center;
      gap: 14px;
      border-radius: 20px;
      padding: 22px 26px;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
    }
    /* 光暈裝飾圓 */
    .country-header::before {
      content: '';
      position: absolute;
      top: -30px;
      right: -30px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      opacity: 0.18;
    }
    .country-header::after {
      content: '';
      position: absolute;
      bottom: -40px;
      left: 30px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      opacity: 0.12;
    }
    .singapore-theme .country-header {
      background: linear-gradient(135deg, #003f6e 0%, #005fa3 40%, #0076cc 70%, #1a8fe0 100%);
    }
    .singapore-theme .country-header::before,
    .singapore-theme .country-header::after {
      background: #ffffff;
    }
    .thailand-theme .country-header {
      background: linear-gradient(135deg, #6b2200 0%, #a33d0a 35%, #c04d10 65%, #e8651a 100%);
    }
    .thailand-theme .country-header::before,
    .thailand-theme .country-header::after {
      background: #ffffff;
    }
    .country-flag {
      font-size: 38px;
      line-height: 1;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    .country-title {
      font-size: 30px;
      font-weight: 800;
      font-style: italic;
      color: #ffffff;
      margin: 0;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
    }

    /* 餐廳卡片清單 */
    .visit-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .visit-item-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .visit-item {
      display: flex;
      align-items: center;
      border-radius: 16px;
      padding: 18px 16px;
      background-color: #1e2130;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      gap: 14px;
      border-left: 6px solid transparent;
    }
    .visit-item:active {
      transform: scale(0.98);
    }

    .singapore-theme .visit-item {
      border-left-color: #4da6f5;
    }
    .singapore-theme .visit-item:hover {
      box-shadow: 0 6px 20px rgba(77, 166, 245, 0.25);
      transform: translateY(-2px);
    }
    .thailand-theme .visit-item {
      border-left-color: #e8651a;
    }
    .thailand-theme .visit-item:hover {
      box-shadow: 0 6px 20px rgba(232, 101, 26, 0.25);
      transform: translateY(-2px);
    }

    /* ICON 區塊 */
    .cell-logo {
      flex-shrink: 0;
      width: 58px;
      height: 58px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      line-height: 1;
    }
    .singapore-theme .cell-logo {
      background-color: #0d2a40;
    }
    .thailand-theme .cell-logo {
      background-color: #2a1800;
    }

    /* 文字資訊 */
    .cell-info {
      flex: 1;
      min-width: 0;
    }
    .info-desc {
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.2px;
      margin-bottom: 5px;
      line-height: 1.4;
    }
    .singapore-theme .info-desc {
      color: #f5e6a3;
    }
    .thailand-theme .info-desc {
      color: #f5e6a3;
    }
    .info-title {
      font-size: 20px;
      font-weight: 400;
      color: #f0f0f0;
      line-height: 1.3;
      word-break: break-word;
    }

    /* 箭頭 */
    .cell-arrow {
      flex-shrink: 0;
      width: 28px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .cell-arrow svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .singapore-theme .cell-arrow svg {
      stroke: #4da6f5;
    }
    .thailand-theme .cell-arrow svg {
      stroke: #e8651a;
    }

    /* 分隔線 */
    .section-divider {
      border: 0;
      height: 2px;
      background: linear-gradient(to right, transparent, #2e3450, transparent);
      margin: 36px 0;
    }
    .location-icon { display: inline-block; width: 1.3em; height: 1.3em; margin-right: .3em; vertical-align: -.3em; object-fit: contain; }

    .preview-note { color: #b9bdcc; text-align: center; font-size: 13px; margin: 0 0 16px; }
    .country-header { margin-bottom: 16px; }
    .ocean-art { border-radius: 22px; overflow: hidden; background: #123958; margin-bottom: 20px; position: relative; border: 1px solid rgba(191, 227, 255, .36); box-shadow: inset 0 1px 0 rgba(255,255,255,.65), 0 12px 30px rgba(0,15,40,.35); }
    .ocean-art svg { display: block; width: 100%; height: auto; }
    .art-caption { padding: 22px 24px 25px; color: #f8e8c7; }
    .art-caption small { color: #88c9cf; letter-spacing: 3px; font-size: 12px; }
    .art-caption h2 { font-size: clamp(25px,6vw,34px); margin: 10px 0; letter-spacing: 2px; }
    .art-caption p { color: #bdd2d5; font-size: 15px; line-height: 1.8; margin: 0; }
    .meal-time { margin: 0 0 20px; color: #e9d6b7; font-size: 15px; line-height: 1.8; }
    .map-hint { color: #db945e; text-align: right; font-size: 18px; font-weight: 600; line-height: 1.6; margin: 14px 4px 0; }
    .illustration-note { text-align: center; color: #7f879c; font-size: 12px; margin: 22px 0 0; }
    /* 餐廳資訊緊湊排版 */
    .visit-item { padding: 18px 20px; gap: 16px; }
    .info-desc { line-height: 1.5; margin-bottom: 6px; }
    .info-title { line-height: 1.5; }
    .info-title > span { display: block; margin-top: 6px; }
    .info-title > br { display: none; }
    .info-title { font-size: 26px; }
    .cell-logo { width: 72px; height: 72px; font-size: 46px; border-radius: 18px; }
    .map-hint-arrow { display: inline-block; font-size: 32px; font-weight: 800; line-height: 1; vertical-align: -3px; margin-right: 4px; }
  </style>
</head>
<body>
  <a href="index.html" class="home-link" title="返回首頁">
    <svg viewBox="0 0 24 24">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
  </a>

  <div class="page-container">

    <!-- Thailand -->

      <div class="country-header">
        <span class="country-flag"></span>
        <h1 class="country-title">Restaurant</h1>
      </div>

      <div class="ocean-art">
        <svg viewBox="0 0 600 310" role="img" aria-label="夕陽暖色與海藍亮面風格的美食插圖">
          <defs>
            <linearGradient id="foodSky" x2="0" y2="1"><stop stop-color="#ffb768"/><stop offset=".4" stop-color="#b1b4d0"/><stop offset="1" stop-color="#123f8b"/></linearGradient>

          </g>
          <g filter="url(#foodDepth)">
            <ellipse cx="120" cy="185" rx="63" ry="20" fill="url(#foodPlate)" stroke="#c1ecff"/>
            <path d="M67 138q3 58 53 59q50-1 54-59Z" fill="url(#foodPlate)" stroke="#d9f3ff" stroke-width="2"/>

            <path d="M78 151q4 20 18 26" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".5" fill="none"/>
          </g>
          <g fill="none" stroke="#fff1df" stroke-width="4" stroke-linecap="round" opacity=".7"><path d="M103 107c-16-16 14-23 2-39"/><path d="M128 101c-14-17 15-26 3-43"/></g>
          <g filter="url(#foodDepth)">
            <path d="m458 111 9 88q19 15 43 0l9-88Z" fill="url(#foodGold)" stroke="#ffe5b6" stroke-width="2"/>
            <ellipse cx="489" cy="111" rx="30" ry="10" fill="#ffe4b5" stroke="#fff1df" stroke-width="2"/>
            <path d="m473 132 5 53" stroke="#fff8e5" stroke-width="5" stroke-linecap="round" opacity=".65"/>
            <path d="m496 137 17-63 15-8" fill="none" stroke="#c1ecff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M457 113a20 20 0 1 1 22-27Z" fill="#ffc866" stroke="#fff1df" stroke-width="3"/>
            <path d="m461 108 8-17m-8 17 18-8" stroke="#fff1df" stroke-width="2"/>
          </g>
          <g fill="none" stroke="#d2eeff" stroke-linecap="round" filter="url(#foodDepth)">
            <path d="m107 235-17 43m9-68-6 18q1 9 14 9q9 2 13-6l6-18m-14-4-8 25" stroke-width="4"/>

        </svg>
        <div class="art-caption"><small>LOST WHALE · HUALIEN</small><h2>一起揮汗，一起享受美食</h2><p>取下號碼布，一同分享今天的精彩。</p></div>
      </div>
      <div class="visit-list">

        <a href="https://maps.app.goo.gl/gLPha9sPPjcPjPwQ9" class="visit-item-link">
          <div class="visit-item">
            <div class="cell-logo" role="img" aria-label="鯨魚">🐳</div>
            <div class="cell-info">
              <div class="info-desc">12/6 (日)・賽後午餐</div>
              <div class="info-title">迷途鯨魚餐廳<br><span style="font-size:20px; color:#fff2a8"><img class="location-icon" src="google-maps-icon.png" width="26" height="26" alt="" aria-hidden="true">花蓮縣壽豐鄉志學村中山路三段62號</span></div>
            </div>
            <div class="cell-arrow">
              <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
            </div>
          </div>
        </a>


      </div>

      <p class="map-hint"><span class="map-hint-arrow" aria-hidden="true">👆</span> 點按餐廳方塊，開啟地圖導航</p>
    </div>

  </div>
</body>
</html>
