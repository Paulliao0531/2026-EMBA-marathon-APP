<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- 手機桌面圖示：iPhone / Android -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="全E馬">
  <meta name="theme-color" content="#0f1117">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=yes">
  <title>Hotels & Accommodations</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      display: block;
      margin: 0;
      padding: 0;
      background-color: #0f1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
      color: #d0d0d0;
    }

    /* 懸浮首頁按鈕 */
    .floating-home-link {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background-color: #1e2130;
      border-radius: 50%;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }
    .floating-home-link:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
    }
    .floating-home-link svg {
      width: 26px;
      height: 26px;
      fill: #e8651a;
      transition: fill 0.2s ease;
    }
    .floating-home-link:hover svg {
      fill: #4da6f5;
    }

    /* 主容器 */
    .page-container {
      max-width: 640px;
      margin: 0 auto;
      padding: 80px 16px 48px;
    }

    /* 頁面標題 */
    .page-title-wrap {
      text-align: center;
      margin-bottom: 6px;
    }
    .page-title {
      display: inline-block;
      font-size: 32px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #0076cc 30%, #e8651a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
    }
    .hotel-tip {
      font-size: 20px;
      color: #ffe600;
      text-align: center;
      margin-bottom: 28px;
    }

    /* 飯店區塊 */
    .hotel-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 36px;
    }

    /* 飯店卡片外框 */
    .hotel-card {
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      background: #1e2130;
    }

    /* 卡片頂部色彩橫幅 */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    }
    .card-header::before {
      content: '';
      position: absolute;
      top: -25px;
      right: -25px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #ffffff;
      opacity: 0.15;
    }
    .card-header::after {
      content: '';
      position: absolute;
      bottom: -35px;
      left: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #ffffff;
      opacity: 0.10;
    }
    .singapore-card .card-header {
      background: linear-gradient(135deg, #003f6e 0%, #005fa3 40%, #0076cc 70%, #1a8fe0 100%);
    }
    .thailand-card .card-header {
      background: linear-gradient(135deg, #6b2200 0%, #a33d0a 35%, #c04d10 65%, #e8651a 100%);
    }
    .card-header-icon {
      font-size: 28px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.3));
    }
    .card-header-label {
      font-size: 26px;
      font-weight: 800;
      font-style: italic;
      color: #ffffff;
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    /* 卡片主體 */
    .card-body {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px;
    }

    /* 飯店圖示 */
    .hotel-link {
      display: block;
      flex-shrink: 0;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    .hotel-link:hover {
      transform: scale(1.04);
    }
    .hotel-link:active {
      transform: scale(0.97);
    }
    .hotel-icon {
      width: 150px;
      height: 225px;
      display: block;
      object-fit: contain;
      background: transparent;
    }

    /* 飯店文字資訊 */
    .hotel-info {
      flex: 1;
      min-width: 0;
    }
    .hotel-name {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.3;
      margin: 0 0 8px 0;
      word-break: break-word;
    }
    .singapore-card .hotel-name {
      color: #4da6f5;
    }
    .thailand-card .hotel-name {
      color: #e8651a;
    }
    .hotel-details {
      font-size: 20px;
      line-height: 1.65;
      color: #ffe600;
      margin: 0;
    }

    /* 分隔線 */
    .section-divider {
      border: 0;
      height: 2px;
      background: linear-gradient(to right, transparent, #2e3450, transparent);
      margin: 8px 0 32px;
    }

    /* 名單區塊標題 */
    .roster-title {
      font-size: 18px;
      font-weight: 800;
      color: #d0d0d0;
      margin: 0 0 14px 0;
      padding-left: 4px;
      border-left: 5px solid #e8651a;
      padding-left: 12px;
    }

    /* 名單表格 */
    .roster-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .roster-cell {
      background: linear-gradient(135deg, #1e2130 0%, #252a3a 100%);
      border: 2px solid #b05a20;
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
      font-size: 20px;
      font-weight: 400;
      color: #e0e0e0;
      white-space: pre-line;
      line-height: 1.5;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(176, 90, 32, 0.2);
    }
    .roster-cell.empty-cell {
      background: transparent;
      border: 2px dashed #2e3450;
      box-shadow: none;
      color: transparent;
    }
    .hotel-image { flex-shrink: 0; }
    .address-link { display: inline-block; min-height: 44px; padding: 6px 0; color: inherit; text-decoration: underline; text-underline-offset: 4px; overflow-wrap: anywhere; }
    .address-link:hover { color: #fff; }
    a:focus-visible { outline: 3px solid #ffca28; outline-offset: 4px; }
  </style>
</head>
<body>
  <a href="index.html" class="floating-home-link" title="返回首頁">
    <svg viewBox="0 0 24 24">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
  </a>

  <div class="page-container">

    <div class="page-title-wrap">
      <h1 class="page-title">Hotels</h1>
    </div>
    <div class="hotel-tip">點擊地址可開啟 Google Maps</div>

    <div class="hotel-section">

      <!-- Thailand -->
      <div class="hotel-card thailand-card">
        <div class="card-header">
          <span class="card-header-label">歡迎來花蓮</span>
        </div>
        <div class="card-body">
          <div class="hotel-image"><img class="hotel-icon" src="amis.webp?v=4957674" alt="飯店圖示"></div>
          <div class="hotel-info">
            <h2 class="hotel-name">花蓮阿思瑪麗景大飯店</h2>
            <p class="hotel-details">
              <a class="address-link" href="https://maps.app.goo.gl/j2DvN8156WkJwUnr6" target="_blank" rel="noopener noreferrer" title="帶我去阿思瑪（另開視窗）">花蓮縣花蓮市主商里博愛街68號</a><br>
              TEL : 03 832 9555
            </p>
          </div>
        </div>
      </div>

    </div>

    <hr class="section-divider">

    <p class="roster-title">房間名單</p>
    <div class="roster-grid">
      <div class="roster-cell">TBD</div>
      <div class="roster-cell">TBD</div>

  </div>
</body>
</html>
