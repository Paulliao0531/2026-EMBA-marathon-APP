<script>
    function loadFullMap(map) {
        const fullMap = new Image();
        fullMap.src = map.dataset.fullSrc;
        fullMap.decode().then(() => {
            map.src = fullMap.src;
        }).catch(() => {});
    }

    const lazyMapObserver = 'IntersectionObserver' in window
        ? new IntersectionObserver((entries, observer) => {
            for (const entry of entries) {
                if (entry.isIntersecting) {
                    observer.unobserve(entry.target);
                    loadFullMap(entry.target);
                }
            }
        }, { rootMargin: '200px' })
        : null;

    for (const map of document.querySelectorAll('.route-map[data-full-src]')) {
        if (map.loading === 'lazy' && lazyMapObserver) {
            lazyMapObserver.observe(map);
        } else {
            loadFullMap(map);
        }
    }
</script>
